<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FAKERS 일정 투표</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #2c2c2a;
  background: #fafaf8;
}

.container {
  width: 100%;
  padding: 1.5rem 1rem;
  max-width: 1400px;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .container {
    padding: 1rem 0.75rem;
  }
}

.header {
  margin-bottom: 1.5rem;
  text-align: center;
}

.header h1 {
  font-size: 26px;
  font-weight: 500;
  margin: 0 0 0.3rem;
  color: #2c2c2a;
  letter-spacing: -0.5px;
}

@media (max-width: 768px) {
  .header h1 {
    font-size: 20px;
    margin: 0 0 0.2rem;
  }
}

.header p {
  font-size: 13px;
  color: #888;
  margin: 0;
}

@media (max-width: 768px) {
  .header p {
    font-size: 12px;
  }
}

.debug-info {
  text-align: center;
  font-size: 11px;
  color: #aaa;
  margin-top: 5px;
}

.debug-info.success {
  color: #22c55e;
}

.debug-info.error {
  color: #ef4444;
}

.main-content {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 1.5rem;
}

@media (max-width: 1200px) {
  .main-content {
    grid-template-columns: 1fr;
  }
}

.left-panel {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

@media (max-width: 768px) {
  .stats {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
  }
}

.stat-card {
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 8px;
  padding: 12px;
  text-align: center;
  transition: all 0.2s ease;
  cursor: default;
}

@media (max-width: 768px) {
  .stat-card {
    padding: 10px;
  }
}

.stat-card:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.stat-label {
  font-size: 11px;
  color: #888;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.stat-date {
  font-size: 10px;
  color: #888;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 20px;
  font-weight: 500;
  color: #2c2c2a;
  margin-bottom: 6px;
}

@media (max-width: 768px) {
  .stat-value {
    font-size: 18px;
  }
}

.schedule-type {
  font-size: 9px;
  font-weight: 600;
  display: inline-block;
  padding: 2px 5px;
  border-radius: 4px;
  margin-bottom: 2px;
}

.schedule-type.training {
  background: #dbeafe;
  color: #1e40af;
}

.schedule-type.match {
  background: #fee2e2;
  color: #991b1b;
}

.table-wrapper {
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
  max-height: 650px;
  display: flex;
  flex-direction: column;
}

.thead-wrapper {
  background: #fafaf8;
  overflow: hidden;
  border-bottom: 1px solid #e0dfd8;
  flex-shrink: 0;
}

.tbody-wrapper {
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 768px) {
  .table-wrapper {
    max-height: 500px;
    border-radius: 8px;
  }
}

.header-table,
.body-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

@media (max-width: 768px) {
  .header-table,
  .body-table {
    font-size: 12px;
  }
}

.header-table {
  table-layout: fixed;
}

.body-table {
  table-layout: fixed;
}

thead {
  background: #fafaf8;
}

th {
  background: #fafaf8;
  padding: 12px 8px;
  text-align: center;
  font-weight: 500;
  border-bottom: 1px solid #e0dfd8;
  color: #2c2c2a;
  font-size: 11px;
  white-space: nowrap;
  word-break: keep-all;
}

@media (max-width: 768px) {
  th {
    padding: 10px 6px;
    font-size: 10px;
  }
}

th:first-child {
  text-align: left;
  min-width: 80px;
  padding-left: 10px;
}

@media (max-width: 768px) {
  th:first-child {
    min-width: 70px;
    padding-left: 8px;
  }
}

th:last-child {
  min-width: 40px;
}

td {
  padding: 10px 8px;
  border-bottom: 1px solid #f0ede6;
}

@media (max-width: 768px) {
  td {
    padding: 8px 6px;
  }
}

tbody tr:last-child td {
  border-bottom: none;
}

tbody tr:hover {
  background: #fafaf8;
}

.player-name {
  font-weight: 500;
  min-width: 80px;
  color: #2c2c2a;
  text-align: left;
  padding-left: 10px;
}

@media (max-width: 768px) {
  .player-name {
    min-width: 70px;
    padding-left: 8px;
    font-size: 13px;
  }
}

.schedule-header {
  max-width: 90px;
  word-wrap: break-word;
  font-size: 11px;
}

.schedule-date {
  font-size: 10px;
  color: #888;
  display: block;
}

.vote-cell {
  text-align: center;
  white-space: nowrap;
  padding: 8px 4px;
}

@media (max-width: 768px) {
  .vote-cell {
    padding: 6px 3px;
  }
}

.vote-btn {
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 11px;
  border: 1px solid #e0dfd8;
  background: #fff;
  color: #888;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-weight: 600;
  margin: 2px;
}

@media (max-width: 768px) {
  .vote-btn {
    width: 28px;
    height: 28px;
    font-size: 10px;
    margin: 1px;
    border-radius: 4px;
  }
}

.vote-btn:hover:not(.yes):not(.no) {
  border-color: #d0cfc8;
  background: #f5f5f0;
}

.vote-btn.yes {
  background: #dcfce7;
  color: #166534;
  border-color: #86efac;
}

.vote-btn.yes:hover {
  background: #bbf7d0;
  border-color: #4ade80;
}

.vote-btn.no {
  background: #fee2e2;
  color: #991b1b;
  border-color: #fca5a5;
}

.vote-btn.no:hover {
  background: #fecaca;
  border-color: #f87171;
}

.total-col {
  font-weight: 600;
  color: #2c2c2a;
  text-align: center;
  min-width: 40px;
}

.right-panel {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.chat-container {
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  height: 600px;
}

@media (max-width: 1200px) {
  .chat-container {
    height: 400px;
  }
}

@media (max-width: 768px) {
  .chat-container {
    height: 350px;
    border-radius: 8px;
  }
}

.chat-header {
  padding: 12px 14px;
  border-bottom: 1px solid #e0dfd8;
  font-weight: 500;
  font-size: 14px;
  color: #2c2c2a;
}

@media (max-width: 768px) {
  .chat-header {
    padding: 10px 12px;
    font-size: 13px;
  }
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}

@media (max-width: 768px) {
  .chat-messages {
    padding: 10px;
    gap: 6px;
  }
}

.message {
  background: #fafaf8;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.4;
}

@media (max-width: 768px) {
  .message {
    padding: 8px 10px;
    font-size: 11px;
  }
}

.message-author {
  font-weight: 600;
  color: #2c2c2a;
  margin-bottom: 2px;
  font-size: 11px;
}

.message-text {
  color: #666;
  word-break: break-word;
}

.chat-input-area {
  padding: 10px;
  border-top: 1px solid #e0dfd8;
  display: flex;
  gap: 6px;
}

@media (max-width: 768px) {
  .chat-input-area {
    padding: 8px;
    gap: 5px;
  }
}

.chat-input-area input {
  flex: 1;
  padding: 10px 12px;
  border: 1px solid #e0dfd8;
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
}

@media (max-width: 768px) {
  .chat-input-area input {
    padding: 8px 10px;
    font-size: 12px;
    border-radius: 3px;
  }
}

.chat-input-area input:focus {
  outline: none;
  border-color: #d0cfc8;
  background: #fafaf8;
}

.chat-send-btn {
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid #e0dfd8;
  background: #fff;
  color: #2c2c2a;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  min-width: 60px;
}

@media (max-width: 768px) {
  .chat-send-btn {
    padding: 8px 10px;
    font-size: 11px;
    min-width: 50px;
    border-radius: 3px;
  }
}

.chat-send-btn:hover {
  background: #f5f5f0;
  border-color: #d0cfc8;
}

.summary {
  margin-top: 1rem;
  padding: 14px;
  background: #fff;
  border: 1px solid #e0dfd8;
  border-radius: 10px;
  font-size: 12px;
}

@media (max-width: 768px) {
  .summary {
    padding: 12px;
    border-radius: 8px;
    font-size: 11px;
    margin-top: 0.5rem;
  }
}

.summary-row {
  display: flex;
  justify-content: space-between;
  margin: 8px 0;
  color: #2c2c2a;
}

@media (max-width: 768px) {
  .summary-row {
    margin: 6px 0;
  }
}

.summary-row span:last-child {
  font-weight: 500;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>FAKERS 훈련 및 일정 투표</h1>
    <p>각 일정별 참석 여부를 투표해 주세요</p>
    <div class="debug-info" id="debugInfo">Firebase 연결 중...</div>
  </div>

  <div class="main-content">
    <div class="left-panel">
      <div class="stats" id="statsContainer"></div>

      <div class="table-wrapper">
        <div class="thead-wrapper">
          <table class="header-table">
            <thead id="tableHead"></thead>
          </table>
        </div>
        <div class="tbody-wrapper">
          <table class="body-table">
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="summary" id="summary"></div>
    </div>

    <div class="right-panel">
      <div class="chat-container">
        <div class="chat-header">📢 공지사항</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="메시지..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="chat-send-btn" onclick="sendMessage()">보내기</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBy_L_lCq56h6XdX7_lx5-KzgZE9YdGI0k",
  authDomain: "fakers-7be74.firebaseapp.com",
  databaseURL: "https://fakers-7be74-default-rtdb.firebaseio.com",
  projectId: "fakers-7be74",
  storageBucket: "fakers-7be74.appspot.com",
  messagingSenderId: "1071895253886",
  appId: "1:1071895253886:web:8d1f9f4e2f4e8c5d4c8f7e"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const schedules = [
  { date: '2026.10.17', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.10.31', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.11.07', type: '[시합]', location: '노들리그', category: 'match' },
  { date: '2026.11.14', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.11.21', type: '[훈련]', location: '장기구장', category: 'training' },
  { date: '2026.12.05', type: '[송년회]', location: '', category: 'match' },
  { date: '2027.01.09', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.01.23', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.02.13', type: '[훈련]', location: '고양실내연습장', category: 'training' },
  { date: '2027.02.20', type: '[훈련]', location: '고양실내연습장', category: 'training' }
];

const players = [
  '박준호', '박충규', '차인태', '박민호', '김병섭', '박세윤', '윤지열', '한동길', '박영욱', '이상헌',
  '장경환', '이원재', '고영일', '조민익', '박상우', '김송섭', '이정현', '유성일', '김구현', '김성주',
  '오영교', '김재명', '이상범', '박신영', '박지호', '이재민'
];

function updateDebugInfo(msg, success = true) {
  const debugEl = document.getElementById('debugInfo');
  debugEl.textContent = msg;
  debugEl.className = 'debug-info ' + (success ? 'success' : 'error');
}

async function getVotes() {
  return new Promise((resolve) => {
    db.ref('votes').once('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        resolve(data);
      } else {
        const votes = {};
        players.forEach(p => {
          votes[p] = {};
          schedules.forEach((_, i) => {
            votes[p][i] = null;
          });
        });
        resolve(votes);
      }
    });
  });
}

async function getChatMessages() {
  return new Promise((resolve) => {
    db.ref('messages').once('value', (snapshot) => {
      const data = snapshot.val();
      resolve(data || []);
    });
  });
}

async function saveVotes(votes) {
  await db.ref('votes').set(votes);
  updateDebugInfo('✓ 저장됨', true);
  await render();
}

async function saveChatMessages(messages) {
  await db.ref('messages').set(messages);
  await renderChat();
}

async function vote(playerName, scheduleIndex, value) {
  const votes = await getVotes();
  const newValue = votes[playerName][scheduleIndex] === value ? null : value;
  votes[playerName][scheduleIndex] = newValue;
  await saveVotes(votes);
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  
  if (!text) return;
  
  const messages = await getChatMessages();
  const timestamp = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  
  messages.push({
    author: '감독',
    text: text,
    time: timestamp
  });
  
  await saveChatMessages(messages);
  input.value = '';
  
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function renderChat() {
  const chatMessages = document.getElementById('chatMessages');
  const messages = await getChatMessages();
  
  chatMessages.innerHTML = '';
  messages.forEach(msg => {
    const messageEl = document.createElement('div');
    messageEl.className = 'message';
    messageEl.innerHTML = `
      <div class="message-author">${msg.author} <span style="color: #aaa; font-size: 10px;">${msg.time}</span></div>
      <div class="message-text">${msg.text}</div>
    `;
    chatMessages.appendChild(messageEl);
  });
  
  setTimeout(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }, 0);
}

async function render() {
  const votes = await getVotes();
  renderHeader();
  await renderBody(votes);
  await renderStats(votes);
  await renderSummary(votes);
}

function renderHeader() {
  const headRow = document.getElementById('tableHead');
  headRow.innerHTML = '';
  
  let html = '<tr><th>선수명</th>';
  schedules.forEach((s) => {
    html += `<th class="vote-cell schedule-header">
      <div class="schedule-type ${s.category}">${s.type}</div>
      <div class="schedule-date">${s.date}</div>
    </th>`;
  });
  html += '<th class="total-col">합계</th></tr>';
  
  headRow.innerHTML = html;
}

async function renderBody(votes) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  
  players.forEach(player => {
    const playerVotes = votes[player];
    let yesCount = 0;
    
    let row = `<tr><td class="player-name">${player}</td>`;
    
    schedules.forEach((_, i) => {
      const vote = playerVotes[i];
      if (vote === 'yes') yesCount++;
      
      const btnClass = vote ? vote : '';
      
      row += `<td class="vote-cell">
        <button class="vote-btn ${btnClass}" onclick="vote('${player}', ${i}, 'yes')" title="참석">O</button>
        <button class="vote-btn ${btnClass}" onclick="vote('${player}', ${i}, 'no')" title="불참">X</button>
      </td>`;
    });
    
    row += `<td class="total-col">${yesCount}</td></tr>`;
    tbody.innerHTML += row;
  });
}

async function renderStats(votes) {
  const statsContainer = document.getElementById('statsContainer');
  statsContainer.innerHTML = '';
  
  const stats = schedules.map((s, i) => {
    let yes = 0, no = 0;
    players.forEach(p => {
      const vote = votes[p][i];
      if (vote === 'yes') yes++;
      else if (vote === 'no') no++;
    });
    
    return {
      date: s.date,
      type: s.type,
      yes, no,
      category: s.category
    };
  });
  
  stats.forEach(stat => {
    const typeClass = stat.category === 'match' ? 'match' : 'training';
    
    const html = `
      <div class="stat-card">
        <div class="stat-label">
          <span class="schedule-type ${typeClass}" style="margin-right: 0;">${stat.type}</span>
        </div>
        <div class="stat-date">${stat.date}</div>
        <div class="stat-value">${stat.yes}</div>
      </div>
    `;
    statsContainer.innerHTML += html;
  });
}

async function renderSummary(votes) {
  const summary = document.getElementById('summary');
  
  let totalYes = 0, totalNo = 0;
  
  players.forEach(p => {
    schedules.forEach((_, i) => {
      const vote = votes[p][i];
      if (vote === 'yes') totalYes++;
      else if (vote === 'no') totalNo++;
    });
  });
  
  const totalResponses = totalYes + totalNo;
  const total = schedules.length * players.length;
  const responseRate = total > 0 ? Math.round((totalResponses / total) * 100) : 0;
  const avgAttendance = schedules.length > 0 ? (totalYes / schedules.length).toFixed(1) : 0;
  
  summary.innerHTML = `
    <div class="summary-row">
      <span>응답률</span>
      <span>${responseRate}%</span>
    </div>
    <div class="summary-row">
      <span>참석/불참</span>
      <span>${totalYes}/${totalNo}</span>
    </div>
    <div class="summary-row">
      <span>평균 참석</span>
      <span>${avgAttendance}명</span>
    </div>
  `;
}

// Firebase 실시간 동기화
db.ref('votes').on('value', (snapshot) => {
  render();
});

db.ref('messages').on('value', (snapshot) => {
  renderChat();
});

// 초기화
(async () => {
  updateDebugInfo('✓ Firebase 연결됨', true);
  await render();
  await renderChat();
})();
</script>

</body>
</html>
